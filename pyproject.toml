[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manfred"
version = "0.1.0"
description = "Private Manfred companion app and audio/visual evidence services"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "faster-whisper>=1.2,<2"]

[project.scripts]
manfred = "manfred_ears.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["manfred_ears*"]
