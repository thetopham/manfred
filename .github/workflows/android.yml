name: Manfred Android

on:
  pull_request:
    paths:
      - 'apps/manfred-companion/**'
      - 'scripts/validate_android_local.py'
      - '.github/workflows/android.yml'
  push:
    # The explicit feature branch supports signed testing before the first merge.
    branches: [main, 'feat/eyevue-photo-session']
    paths:
      - 'apps/manfred-companion/**'
      - 'scripts/validate_android_local.py'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true
      - name: Analyze, test, and build an ephemeral validation APK
        run: python3 scripts/validate_android_local.py --output "$RUNNER_TEMP/manfred-companion-ephemeral.apk"

  build-stable:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true
      - name: Analyze, test Flutter and native EyeVue, build, and verify signer
        env:
          MANFRED_ANDROID_KEYSTORE_BASE64: ${{ secrets.MANFRED_ANDROID_KEYSTORE_BASE64 }}
          MANFRED_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MANFRED_ANDROID_KEYSTORE_PASSWORD }}
          MANFRED_ANDROID_KEY_PASSWORD: ${{ secrets.MANFRED_ANDROID_KEY_PASSWORD }}
          MANFRED_ANDROID_KEY_ALIAS: ${{ secrets.MANFRED_ANDROID_KEY_ALIAS }}
        run: python3 scripts/validate_android_local.py --require-stable-signing --output "$RUNNER_TEMP/manfred-companion.apk"
