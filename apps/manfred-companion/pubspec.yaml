name: manfred_companion
description: Omi audio and EyeVue photo companion for the Galaxy S25.
publish_to: none
version: 0.5.4+12

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  flutter_blue_plus: 2.3.12
  flutter_foreground_task: 11.0.1
  flutter_secure_storage: ^9.2.4
  http: ^1.5.0
  opus_codec_android: 3.0.5
  opus_codec_dart: 3.0.5
  opus_codec_platform_interface: 3.0.0
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.3
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
